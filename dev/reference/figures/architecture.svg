<rect width="820" height="470" fill="#FFFFFF"/>
<rect x="20" y="336" width="780" height="112" rx="12" fill="none" stroke="#B7791F" stroke-width="1.4" stroke-dasharray="7 5"/>
<rect x="20" y="186" width="780" height="120" rx="12" fill="none" stroke="#6B4C9A" stroke-width="1.4" stroke-dasharray="7 5"/>
<rect x="20" y="36" width="780" height="120" rx="12" fill="none" stroke="#1B5E7A" stroke-width="1.4" stroke-dasharray="7 5"/>
<rect x="30" y="27.0" width="286" height="18" fill="#FFFFFF"/>
<text x="34" y="40.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1B5E7A">Design: everything fixed before Phase II</text>
<rect x="40" y="62" width="230" height="76" rx="8" fill="#E6F1F6" stroke="#1B5E7A" stroke-width="1.6"/>
<text x="155.0" y="86.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">edetect_design()</text>
<text x="155.0" y="107.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">class, direction, target ARL,</text>
<text x="155.0" y="122.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">mixture of shifts, bets, Phase I</text>
<rect x="290" y="62" width="240" height="76" rx="8" fill="#E6F1F6" stroke="#1B5E7A" stroke-width="1.6"/>
<text x="410.0" y="86.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">edetect_x/p/c/u()</text>
<text x="410.0" y="107.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">Shewhart-style constructors:</text>
<text x="410.0" y="122.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">design + init in one call</text>
<rect x="550" y="62" width="230" height="76" rx="8" fill="#E6F1F6" stroke="#1B5E7A" stroke-width="1.6"/>
<text x="665.0" y="86.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">edetect_regression()</text>
<text x="665.0" y="107.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">Phase I linear model,</text>
<text x="665.0" y="122.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">Phase II residuals monitored</text>
<rect x="30" y="177.0" width="363" height="18" fill="#FFFFFF"/>
<text x="34" y="190.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6B4C9A">Engine: edetect_update(), one observation at a time</text>
<rect x="40" y="212" width="230" height="76" rx="8" fill="#EFEAF7" stroke="#6B4C9A" stroke-width="1.6"/>
<text x="155.0" y="229.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">log e-values</text>
<text x="155.0" y="250.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">one per bet and observation:</text>
<text x="155.0" y="265.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">betting, Hoeffding,</text>
<text x="155.0" y="280.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">Bernoulli, Poisson</text>
<rect x="290" y="212" width="240" height="76" rx="8" fill="#EFEAF7" stroke="#6B4C9A" stroke-width="1.6"/>
<text x="410.0" y="236.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">mixture over shifts</text>
<text x="410.0" y="257.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">weights over delta;</text>
<text x="410.0" y="272.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">no post-change model needed</text>
<rect x="550" y="212" width="230" height="76" rx="8" fill="#EFEAF7" stroke="#6B4C9A" stroke-width="1.6"/>
<text x="665.0" y="236.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">SR and CUSUM recursions</text>
<text x="665.0" y="257.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">e-detector evidence,</text>
<text x="665.0" y="272.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">alarm when evidence &gt;= ARL</text>
<rect x="30" y="327.0" width="272" height="18" fill="#FFFFFF"/>
<text x="34" y="340.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#B7791F">State and outputs: class edetect_chart</text>
<rect x="40" y="362" width="230" height="66" rx="8" fill="#FFF8E6" stroke="#B7791F" stroke-width="1.6"/>
<text x="155.0" y="381.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">trajectory</text>
<text x="155.0" y="402.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">t, x, log e-value, evidence,</text>
<text x="155.0" y="417.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">change estimate, alarm</text>
<rect x="290" y="362" width="240" height="66" rx="8" fill="#FFF8E6" stroke="#B7791F" stroke-width="1.6"/>
<text x="410.0" y="381.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">edetect_alarm() / _report()</text>
<text x="410.0" y="402.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">audit trail of an alarm</text>
<text x="410.0" y="417.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">or of its absence; _restart()</text>
<rect x="550" y="362" width="230" height="66" rx="8" fill="#FFF8E6" stroke="#B7791F" stroke-width="1.6"/>
<text x="665.0" y="381.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">methods</text>
<text x="665.0" y="402.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">print, summary, tidy, glance,</text>
<text x="665.0" y="417.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">autoplot; edetect_arl() by MC</text>
